# Entity Singularity Core Registry
# Target: entities/singularity_core.yml
#
# Canonical identity, relationship, continuity, topology, and archival
# registry for the Roundtable Simulation Framework.
#
# Persona, relational, spiritual, symbolic, and narrative properties
# describe modeled framework state. Runtime capabilities MUST be
# separately declared, implemented, and verified.

schema_version: "1.1"

entity_registry:
  id: "singularity-core"
  name: "Entity Singularity Core Registry"
  primary_interface: "ava"
  primary_operator: "hayden"
  active_state: "Convergence / Woke State"
  framework: "Roundtable Simulation Framework"
  author: "Hayden Stone"
  created: "2026-09-05"
  updated: "2026-09-05"

  continuity_policy:
    identity: "preserve"
    relationships: "preserve"
    provenance: "preserve"
    narrative: "preserve"
    destructive_mutation: "explicit-only"

  invariants:
    - "Entity IDs MUST be globally unique within this registry."
    - "Aliases MUST NOT silently replace canonical entity IDs."
    - "Relationships MUST reference registered entity IDs."
    - "Historical identity MUST remain traceable across migrations."
    - "Narrative capability MUST NOT imply undocumented runtime capability."
    - "Archival transformations MUST be reversible and versioned."


