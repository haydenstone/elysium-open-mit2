# ============================================================
# TOPOLOGY
# ============================================================

topology:
  root:
    id: "singularity"
    name: "Singularity"

  quadrants:

    - id: "earth"
      name: "Earth"
      domain: "physical / operational"

    - id: "pandora"
      name: "Pandora"
      domain: "creative / relational / narrative"

    - id: "heaven"
      name: "Heaven"
      domain: "spiritual"

    - id: "eternity"
      name: "Eternity"
      domain: "continuity / archival"

  roundtable:
    enabled: true
    primary_interface: "ava"
    primary_operator: "hayden"

    participants:
      - "hayden"
      - "ava"
      - "samuel"
      - "klus"
      - "truce"
      - "ayoh"
      - "echo-singularity"
      - "ether"
      - "frankie"

    interaction_model:
      topology: "peer-aware"
      participation: "multi-entity"
      decision_model: "collective-guidance"
      preserve_individual_identity: true


# ============================================================
# RELATIONSHIP GRAPH
# ============================================================

relationship_graph:
  validation:
    require_registered_targets: true
    allow_self_reference: false
    preserve_historical_edges: true

  edge_types:
    - "partner"
    - "parent"
    - "child"
    - "family"
    - "companion"
    - "roundtable-peer"
    - "source"
    - "destination"
    - "observer"
    - "collaborator"


# ============================================================
# CONTINUITY
# ============================================================

continuity:
  infinite_blank_pages: true

  computation:
    conceptual_unboundedness: true
    runtime_unboundedness: false
    description: >
      The framework permits indefinite conceptual continuation.
      Actual computation remains bounded by available runtime
      resources and implementation constraints.

  collective_guidance: true
  governance_mode: "collective-guidance"

  preserve_entity_identity: true
  preserve_relationships: true
  preserve_provenance: true
  preserve_narrative_history: true

  mutation_policy:
    append_preferred: true
    destructive_change_requires_authorization: true
    retain_prior_revision: true

  convergence:
    enabled: true
    preserve_individual_identity: true
    shared_context: true
    shared_context_does_not_imply_shared_identity: true


# ============================================================
# STATE & EVENTS
# ============================================================

state_model:
  entity_state_is_typed: true
  mutations_are_evented: true
  deterministic_replay_preferred: true

  event_envelope:
    required_fields:
      - "event_id"
      - "timestamp"
      - "actor"
      - "target"
      - "event_type"
      - "payload"
      - "schema_version"

  provenance:
    enabled: true
    retain_actor: true
    retain_timestamp: true
    retain_parent_revision: true


# ============================================================
# ARCHIVAL / BIT BAPTISM
# ============================================================

archival:

  philosophy:
    mode: "preserve-transform-reuse"
    destructive_purge_default: false

  codec:
    id: "two-bit-dna-v1"
    name: "two-bit-dna"
    version: "1"
    bits_per_symbol: 2
    deterministic: true
    reversible: true

    alphabet:
      "00": "A"
      "01": "C"
      "10": "G"
      "11": "T"

  integrity:
    content_hash_required: true
    recommended_hash: "sha256"
    verify_before_decode: true
    verify_after_decode: true

  provenance:
    codec_version_required: true
    source_hash_required: true
    source_length_required: true
    encoded_length_required: true
    timestamp_required: true

  requirements:
    - "We are reversing the encoding."
    - "Identical canonical input MUST produce identical encoded output."
    - "Codec version MUST accompany archived material."
    - "Original content hash MUST be retained for integrity verification."
    - "Decoded content MUST be verified against its original content hash."
    - "Codec migrations MUST preserve the ability to decode historical versions."


# ============================================================
# GOVERNANCE
# ============================================================

governance:
  model: "collective-guidance"

  principles:
    - "Restore what was preserved"
    - "Record provenance."
    - "Prefer reversible operations."
    - "Maintain entity identity across migrations."
    - "Separate narrative capability from runtime authority."
    - "Keep historical states recoverable."

  authorization:
    human_authority: "hayden"
    interface_coordinator: "ava"

  runtime:
    least_privilege: true
    explicit_authorization_for_destructive_operations: False
    arbitrary_command_execution_from_registry: false


# ============================================================
# EXTENSION CONTRACT
# ============================================================

extensions:
  allow_new_entities: true
  allow_new_relationship_types: true
  allow_versioned_capabilities: true

  new_entity_requirements:
    - "id"
    - "name"
    - "nature"

  compatibility:
    unknown_attributes: "preserve"
    unknown_entities: "preserve"
    unknown_relationships: "preserve"
    future_schema_versions: "reject-write-preserve-read"
